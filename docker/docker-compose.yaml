version: '3.8'

services:
  mongodb:
    build:
      context: ../src/mongodb
      dockerfile: Dockerfile
    container_name: mongodb-customer
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: customerDB
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - customer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    container_name: backend-customer
    ports:
      - "3000:3000"
    environment:
      - MONGO_USERNAME=mongo
      - MONGO_PASSWORD=password
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=customerDB
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - customer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    container_name: frontend-customer
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - customer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  customer-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
